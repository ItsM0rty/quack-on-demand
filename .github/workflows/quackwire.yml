name: quackwire native build

# Builds the JNI shim `libquackwire.{so,dylib,dll}` for the five platforms
# the manager runs on and uploads each as a build artifact. Binaries are
# vendored in git under libquackwire/binaries/ (see build.sbt's
# resourceGenerator); scripts/release/refresh-quackwire-binaries.sh builds the host
# platform locally and downloads the rest from a green run of this workflow
# for the same commit, checks every binary's build marker against the pin,
# then a developer reviews and commits the diff. No Central publish, no GPG,
# no Sonatype.
#
# Co-pinned versions, read from the tree by the `pin` job (nothing is
# hard-coded here):
#   - duckdb-quack : the native/quackwire/thirdparty/duckdb-quack submodule
#                    commit (its short sha is the middle segment of
#                    build.sbt's libquackwireVersion)
#   - libduckdb    : the official release zips of project/Versions.scala's
#                    `val duckdb` (X.Y.Z.W -> tag vX.Y.Z) on every platform:
#                    libduckdb-{linux-amd64,linux-arm64,osx-universal,
#                    windows-amd64}.zip, plus the internal headers from the
#                    duckdb repo at the same tag. Homebrew is NOT used (its
#                    bottle lags releases).
#
# DuckDB 2.0 pre-release (until v2.0.0 ships): there are no v2.0.0 release
# zips or tag yet, so every build leg fails at "Install libduckdb" with a 404.
# That is deliberate: this workflow must not produce natives against any other
# DuckDB than the pin. Until then only osx-aarch64 is rebuilt, on a developer
# host against the locally built engine (.duckdb/2.0.0), and the other four
# vendored binaries are stale 1.5.6 builds the manager refuses at boot. The
# 2.0 legs of this file (zip names, header staging, the Windows shim in
# native/quackwire/src/win_duckdb_compat.cpp) are UNVERIFIED until the
# release zips exist.
#
# Runner labels (verified 2026-06-01):
#   - ubuntu-22.04        : standard linux/x86_64, free on public repos
#   - ubuntu-22.04-arm    : linux/arm64, free on public repos since
#                           https://github.blog/changelog/2025-01-16-...
#   - macos-15-intel      : x86_64 macOS; macos-13 is deprecated as of
#                           the 2026 runner-images cleanup so we use the
#                           current Intel-on-macOS-15 image instead
#   - macos-14            : arm64 macOS (Apple Silicon)

on:
  push:
    branches: [main]
    paths:
      - 'native/quackwire/**'
      - 'libquackwire/**'
      - 'build.sbt'
      - 'project/Versions.scala'
      - 'scripts/release/quackwire-build-info.sh'
      - '.github/workflows/quackwire.yml'
  pull_request:
    paths:
      - 'native/quackwire/**'
      - 'libquackwire/**'
      - 'build.sbt'
      - 'project/Versions.scala'
      - 'scripts/release/quackwire-build-info.sh'
      - '.github/workflows/quackwire.yml'
  workflow_dispatch:

concurrency:
  group: quackwire-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -----------------------------------------------------------------------
  # 0. The pins, read from the tree so the legs cannot drift from them
  # -----------------------------------------------------------------------
  pin:
    name: read the DuckDB pin
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      duckdb: ${{ steps.pin.outputs.duckdb }}
      libquackwire: ${{ steps.pin.outputs.libquackwire }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          set -euo pipefail
          # `val duckdb = "X.Y.Z.W"` (not duckdbJdbc) -> X.Y.Z, the release tag's version.
          duckdb="$(sed -nE 's/^[[:space:]]*val duckdb[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+".*/\1/p' project/Versions.scala)"
          libquackwire="$(grep -E '^val libquackwireVersion' build.sbt | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ -n "$duckdb" && -n "$libquackwire" ]] \
            || { echo "::error::cannot read val duckdb (project/Versions.scala) or libquackwireVersion (build.sbt)"; exit 1; }
          [[ "$libquackwire" == "$duckdb-"* ]] \
            || { echo "::error::libquackwireVersion $libquackwire does not start with the DuckDB pin $duckdb"; exit 1; }
          echo "DuckDB pin: v$duckdb, libquackwire: $libquackwire"
          echo "duckdb=$duckdb" >> "$GITHUB_OUTPUT"
          echo "libquackwire=$libquackwire" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # 1. Per-platform native build
  # -----------------------------------------------------------------------
  build:
    name: build ${{ matrix.platform }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DUCKDB_VERSION: ${{ needs.pin.outputs.duckdb }}
      LIBQUACKWIRE_VERSION: ${{ needs.pin.outputs.libquackwire }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            libname: libquackwire.so
            os: linux
            duckdb_zip: libduckdb-linux-amd64.zip
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
            libname: libquackwire.so
            os: linux
            duckdb_zip: libduckdb-linux-arm64.zip
          - runner: macos-15-intel
            platform: osx-x86_64
            libname: libquackwire.dylib
            os: macos
            duckdb_zip: libduckdb-osx-universal.zip
          - runner: macos-14
            platform: osx-aarch64
            libname: libquackwire.dylib
            os: macos
            duckdb_zip: libduckdb-osx-universal.zip
    steps:
      - name: Checkout (with duckdb-quack submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21 (for jni.h)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # --- pinned libduckdb install (v$DUCKDB_VERSION) ----------------------
      # macOS: assemble DUCKDB_HOME from the official release zip, same
      # pattern as Windows. We deliberately do NOT use Homebrew: its bottle
      # lags DuckDB releases (it was still 1.5.4 the day 1.5.5 shipped) and the
      # macOS leg must link the exact pinned ABI. CMakeLists probes
      # $ENV{DUCKDB_HOME}{,/include,/lib} FIRST, so this wins over any
      # /opt/homebrew leftovers on the runner.
      - name: Install libduckdb v${{ env.DUCKDB_VERSION }} (macOS)
        if: matrix.os == 'macos'
        env:
          DUCKDB_ZIP: ${{ matrix.duckdb_zip }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/duckdb-home"
          mkdir -p "$home/include" "$home/lib"
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/$DUCKDB_ZIP" \
            "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/$DUCKDB_ZIP" \
            || { echo "::error::no DuckDB v$DUCKDB_VERSION release zip $DUCKDB_ZIP (not released yet?)"; exit 1; }
          unzip -o "$tmp/$DUCKDB_ZIP" -d "$tmp/extracted"
          cp "$tmp/extracted/duckdb.h"   "$home/include/duckdb.h"
          cp "$tmp/extracted/duckdb.hpp" "$home/include/duckdb.hpp"
          cp "$tmp/extracted/libduckdb.dylib" "$home/lib/libduckdb.dylib"
          # Nested INTERNAL headers (duckdb/common/serializer/*.hpp etc.),
          # same reason as the Linux step below.
          git clone --depth 1 --branch "v$DUCKDB_VERSION" https://github.com/duckdb/duckdb "$tmp/duckdb-src"
          cp -r "$tmp/duckdb-src/src/include/duckdb" "$home/include/"
          echo "DUCKDB_HOME=$home" >> "$GITHUB_ENV"
          ls -l "$home/lib/libduckdb.dylib" "$home/include/duckdb.hpp"
          ls "$home/include/duckdb/common/serializer/binary_serializer.hpp"

      # Linux: download the official libduckdb release zip and stage into
      # /usr/local. The CMake `find_path / find_library` hints in
      # native/quackwire/CMakeLists.txt cover /usr/local/{include,lib}.
      # Asset names, verified on the v1.5.6 release page (re-check on the
      # pinned release: gh api repos/duckdb/duckdb/releases/tags/v<pin>
      # .assets[].name):
      #   libduckdb-linux-amd64.zip   (x86_64)
      #   libduckdb-linux-arm64.zip   (aarch64)
      - name: Install libduckdb v${{ env.DUCKDB_VERSION }} (Linux)
        if: matrix.os == 'linux'
        env:
          DUCKDB_ZIP: ${{ matrix.duckdb_zip }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip ca-certificates curl cmake build-essential git
          tmp=$(mktemp -d)
          # 1. Binary + amalgamated public headers from the official release.
          curl -fsSL -o "$tmp/$DUCKDB_ZIP" \
            "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/$DUCKDB_ZIP" \
            || { echo "::error::no DuckDB v$DUCKDB_VERSION release zip $DUCKDB_ZIP (not released yet?)"; exit 1; }
          unzip -o "$tmp/$DUCKDB_ZIP" -d "$tmp/extracted"
          sudo install -m 0644 "$tmp/extracted/duckdb.h"   /usr/local/include/duckdb.h
          sudo install -m 0644 "$tmp/extracted/duckdb.hpp" /usr/local/include/duckdb.hpp
          sudo install -m 0755 "$tmp/extracted/libduckdb.so" /usr/local/lib/libduckdb.so
          # 2. Nested INTERNAL headers (duckdb/common/serializer/*.hpp etc.).
          # The release zip ships only the amalgamated duckdb.{h,hpp}; the
          # duckdb-quack message layer pulls `duckdb/common/serializer/
          # binary_serializer.hpp` directly; we grab them from a shallow
          # clone at the same tag.
          git clone --depth 1 --branch "v$DUCKDB_VERSION" https://github.com/duckdb/duckdb "$tmp/duckdb-src"
          sudo cp -r "$tmp/duckdb-src/src/include/duckdb" /usr/local/include/
          sudo ldconfig
          ls -l /usr/local/lib/libduckdb.so /usr/local/include/duckdb.hpp
          ls /usr/local/include/duckdb/common/serializer/binary_serializer.hpp

      - name: CMake configure
        working-directory: native/quackwire
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        working-directory: native/quackwire
        run: cmake --build build --config Release

      - name: Verify artifact
        working-directory: native/quackwire/build
        run: |
          set -euo pipefail
          ls -la "${{ matrix.libname }}"
          file "${{ matrix.libname }}" || true
          # Smoke-check the smokeAnswer symbol made it through the link.
          if command -v nm >/dev/null 2>&1; then
            nm -gU "${{ matrix.libname }}" 2>/dev/null | grep -i smokeAnswer || \
              nm    "${{ matrix.libname }}" 2>/dev/null | grep -i smokeAnswer || \
              echo "warn: smokeAnswer symbol not found via nm"
          fi
          # The build marker must name the pin (protocol, DuckDB release,
          # duckdb-quack commit); the refresh script and the release gate
          # check the same thing on the vendored files.
          source "$GITHUB_WORKSPACE/scripts/release/quackwire-build-info.sh"
          quackwire_build_marker "${{ matrix.libname }}"
          quackwire_check_build_marker "${{ matrix.libname }}" "$LIBQUACKWIRE_VERSION"
          # Linux: -z now, so a missing libduckdb symbol fails System.load
          # (a boot refusal) instead of killing the JVM at the first call.
          if [[ "${{ matrix.os }}" == linux ]]; then
            readelf -d "${{ matrix.libname }}" | grep -E 'BIND_NOW|FLAGS.*NOW' \
              || { echo "::error::${{ matrix.libname }} is not linked with -z now"; exit 1; }
          fi

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: quackwire-${{ matrix.platform }}
          path: native/quackwire/build/${{ matrix.libname }}
          if-no-files-found: error
          retention-days: 30

  # -----------------------------------------------------------------------
  # 1b. Windows native build (MSVC) -> quackwire.dll
  # -----------------------------------------------------------------------
  # Separate job (not a matrix row) because the toolchain is MSVC + a
  # hand-assembled DUCKDB_HOME rather than a system package. Produces the
  # un-prefixed `quackwire.dll` (System.mapLibraryName has no "lib" prefix on
  # Windows), uploaded as quackwire-windows-x86_64 alongside the four Unix
  # artifacts so scripts/release/refresh-quackwire-binaries.sh's `quackwire-*` glob
  # picks it up when it downloads from the latest green run on main.
  build-windows:
    name: build windows-x86_64
    needs: pin
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      DUCKDB_VERSION: ${{ needs.pin.outputs.duckdb }}
      LIBQUACKWIRE_VERSION: ${{ needs.pin.outputs.libquackwire }}
    steps:
      - name: Checkout (with duckdb-quack submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21 (for jni.h / jni_md.h win32)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Assemble DUCKDB_HOME the way CMakeLists.txt expects: duckdb.lib + the
      # FULL duckdb/ include tree. The release zip ships only the amalgamated
      # duckdb.{h,hpp}; the duckdb-quack message layer also pulls internal
      # headers (duckdb/common/serializer/binary_serializer.hpp), grabbed from a
      # shallow clone at the same pinned tag. Runs in git-bash for parity with
      # the Linux step.
      - name: Install libduckdb v${{ env.DUCKDB_VERSION }} (Windows)
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/duckdb-home"
          mkdir -p "$home/include" "$home/lib"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/libduckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/libduckdb-windows-amd64.zip" \
            || { echo "::error::no DuckDB v$DUCKDB_VERSION release zip libduckdb-windows-amd64.zip (not released yet?)"; exit 1; }
          unzip -o "$tmp/libduckdb.zip" -d "$tmp/dl"
          cp "$tmp/dl/duckdb.h"   "$home/include/duckdb.h"
          cp "$tmp/dl/duckdb.hpp" "$home/include/duckdb.hpp"
          cp "$tmp/dl/duckdb.lib" "$home/lib/duckdb.lib"
          cp "$tmp/dl/duckdb.dll" "$home/lib/duckdb.dll"
          git clone --depth 1 --branch "v$DUCKDB_VERSION" https://github.com/duckdb/duckdb "$tmp/duckdb-src"
          cp -r "$tmp/duckdb-src/src/include/duckdb" "$home/include/"
          ls "$home/lib/duckdb.lib" "$home/include/duckdb.hpp"
          ls "$home/include/duckdb/common/serializer/binary_serializer.hpp"
          echo "DUCKDB_HOME=$home" >> "$GITHUB_ENV"
          # CMakeLists.txt runs a configure-time probe linked to duckdb.dll to
          # read the version and source id the build marker records.
          cygpath -w "$home/lib" >> "$GITHUB_PATH"

      - name: CMake configure (Visual Studio 2022)
        working-directory: native/quackwire
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDUCKDB_HOME="$env:DUCKDB_HOME"

      - name: CMake build (Release)
        working-directory: native/quackwire
        run: cmake --build build --config Release

      - name: Verify artifact
        working-directory: native/quackwire/build/Release
        run: |
          Get-ChildItem quackwire.dll
          # Best-effort export check: dumpbin is only on PATH inside an MSVC dev
          # shell, so a missing tool must not fail the build.
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          if ($dumpbin) {
            & $dumpbin /exports quackwire.dll | Select-String -Pattern 'smokeAnswer' -SimpleMatch
          } else {
            Write-Host "dumpbin not on PATH; skipping export check"
          }

      - name: Verify build marker
        working-directory: native/quackwire/build/Release
        shell: bash
        run: |
          set -euo pipefail
          source ../../../../scripts/release/quackwire-build-info.sh
          quackwire_build_marker quackwire.dll
          quackwire_check_build_marker quackwire.dll "$LIBQUACKWIRE_VERSION"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: quackwire-windows-x86_64
          path: native/quackwire/build/Release/quackwire.dll
          if-no-files-found: error
          retention-days: 30
